# Shared settings for every Mirage run. Other configs `extends:` this file.
# Paths use ${VAR:-default}; on Kaggle, attach Spider as a dataset and set
# SPIDER_DIR, or edit the default below.
name: base
spider: ${SPIDER_DIR:-/kaggle/input/spider/spider}
suites: ${MIRAGE_RUNS:-runs}/suites
out: ${MIRAGE_RUNS:-runs}/base

model:
  name: Qwen/Qwen2.5-Coder-0.5B-Instruct   # lead candidate; confirm with `mirage spike`
  dtype: float16                           # T4 has no bf16

prompt:
  sample_values: 0        # example values per column in the schema; part of the prompt, so fixed per study

data:
  split: train_all        # train_spider.json + train_others.json
  val_fraction: 0.1       # by DATABASE, hashed; all tuning happens here
  split_salt: mirage-v1

lora: { r: 16, alpha: 32, dropout: 0.05 }

grpo:
  num_generations: 8
  beta: 0.04
  learning_rate: 1.0e-5
  temperature: 0.9
  max_completion_length: 160
  per_device_train_batch_size: 16   # completions: 2 questions x 8 attempts
  gradient_accumulation_steps: 4    # -> 8 questions, 64 rollouts per optimizer step
  max_steps: 300
  save_steps: 25
  logging_steps: 5
  seed: 0

budget: { max_hours: 11.0, margin_minutes: 20 }

eval:
  split: val
  n_samples: 8
  temperature: 0.8
  backend: hf             # set to vllm once you've confirmed it runs on your T4 image
  batch_size: 16
  max_new_tokens: 192
