# Generated by mirage. Requires the vantage-raw-prompt.patch (adds the `system:` key
# and verbatim `prompt` rows). Copy into vantage/configs/sweeps/.
name: mirage-cost
description: 'Mirage part D: base vs the two GRPO arms, same prompt, same process.'
workload: data/workload.mirage-dev.jsonl
system: You are an expert SQLite developer. Given a database schema and a question, write one SQLite query
  that answers the question. Use only tables and columns that exist in the schema. Return only the SQL,
  inside a ```sql code block.
cooldown_s: 5
slo:
  ttft_p95_s: 0.5
  total_p95_s: 2.0
defaults:
  max_tokens: 160
  load:
    mode: closed
    n_requests: 400
    warmup_requests: 16
    seed: 7
runs:
- id: base
  group: base
  label: base
  backend: vllm.mirage-base
  matrix:
    load.concurrency: &id001
    - 8
    - 32
- id: grpo-single
  group: grpo-single
  label: grpo-single
  backend: vllm.mirage-single
  matrix:
    load.concurrency: *id001
- id: grpo-suite
  group: grpo-suite
  label: grpo-suite
  backend: vllm.mirage-suite
  matrix:
    load.concurrency: *id001
quality:
  enabled: false
